name: Windows desktop app
# Builds the Windows installer (.exe via NSIS, and .msi) with Tauri.
# Run it under Actions → "Windows desktop app" → Run workflow (with a version, it also publishes a GitHub Release
# with the installer), or push a tag desktop-v*.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.0); leave empty to only build"
        required: false
        default: ""
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Wortschatz-4034-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('desktop-v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Wortschatz 4034 für Windows ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          body: |
            Windows-App: **Wortschatz.4034_…_x64-setup.exe** herunterladen und ausführen (kein Admin nötig).
            Windows SmartScreen kann warnen („Unbekannter Herausgeber“): „Weitere Informationen“ → „Trotzdem ausführen“.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
