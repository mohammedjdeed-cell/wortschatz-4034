name: Windows desktop app
# Builds the Windows installer (.exe via NSIS, and .msi) with Tauri.
# Run it under Actions → "Windows desktop app" → Run workflow, or push a tag desktop-v* to publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Wortschatz-4034-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wortschatz 4034 für Windows ${{ github.ref_name }}
          body: |
            Windows-App: **Wortschatz.4034_…_x64-setup.exe** herunterladen und ausführen (kein Admin nötig).
            Windows SmartScreen kann warnen („Unbekannter Herausgeber“): „Weitere Informationen“ → „Trotzdem ausführen“.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
