[package]
name = "wortschatz-4034"
version = "2.0.2"
description = "Wortschatz 4034 – Windows desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tiny_http = "0.12"
